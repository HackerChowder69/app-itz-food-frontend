services:
  - type: web
    name: app-itz-food-frontend
    runtime: static
    repo: https://github.com/HackerChowder69/app-itz-food-frontend.git
    branch: main
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_AUTH0_DOMAIN
        sync: false
      - key: VITE_AUTH0_CLIENT_ID
        sync: false
      - key: VITE_AUTH0_CALLBACK_URL
        sync: false
      - key: VITE_AUTH0_AUDIENCE
        sync: false
